[project]
name = "quizesame"
version = "0.2.1"
description = "Gestione locale di creazione e correzione di compiti d'esame a risposta multipla"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
quizesame = "quizesame.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quizesame*"]
