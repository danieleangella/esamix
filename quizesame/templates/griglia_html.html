{% extends "base.html" %}
{% block title %}Griglia blocco {{ numero }} · {{ appello.nome }}{% endblock %}
{% block content %}
<p><a href="/corsi/{{ corso.tag }}/appelli/{{ appello.id }}#creazione">&larr; {{ appello.nome }}</a></p>
<h1>Griglia soluzioni — blocco {{ numero }}</h1>

<div class="card">
  <table>
    <tr><th>Codice</th><th>Griglia</th></tr>
    {% for c in compiti %}
    <tr><td>{{ c.codice }}</td><td>{{ c.soluzioni }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
